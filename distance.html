<!DOCTYPE html>
<html>

<head>
    <title>Distance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Distance Calculator</h1>

    <p class="subtitle">How Far from University?</p>

    <label>Enter X Coordinate</label><br><br>

    <input type="number" id="x" placeholder="Enter X"><br><br>

    <label>Enter Y Coordinate</label><br><br>

    <input type="number" id="y" placeholder="Enter Y"><br><br>

    <button onclick="calculate()">Calculate</button>

    <hr>

    <h2 id="answer">Distance = 0.00</h2>

</div>

<script>

function calculate(){

    var x = parseFloat(document.getElementById("x").value);
    var y = parseFloat(document.getElementById("y").value);

    // Validation
    if(isNaN(x) || isNaN(y))
    {
        document.getElementById("answer").innerHTML =
        "Please enter both X and Y.";
        return;
    }

    var distance = Math.sqrt((x*x) + (y*y));

    document.getElementById("answer").innerHTML =
    "Distance = " + distance.toFixed(2);

}

   </script>
   <button onclick="history.back()">Back</button>
   </button>

</body>

</html>
