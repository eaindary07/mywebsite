<!DOCTYPE html>
<html>
<head>
    <title>Change Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Change Calculator</h1>

    <label>Enter Amount (Baht)</label><br><br>

    <input type="number" id="money" placeholder="Example: 3789">

    <button onclick="calculate()">Calculate</button>

    <hr>

    <h2 id="result"></h2>

</div>

<script>

function calculate(){

    var amount = parseInt(document.getElementById("money").value);

    if(isNaN(amount)){
        document.getElementById("result").innerHTML =
        "Please enter an amount.";
        return;
    }
    if(amount < 0){
        document.getElementById("result").innerHTML =
        "Amount cannot be negative.";
        return;
    }

    var note1000 = Math.floor(amount / 1000);
    amount = amount % 1000;

    var note500 = Math.floor(amount / 500);
    amount = amount % 500;

    var note100 = Math.floor(amount / 100);
    amount = amount % 100;

    var note50 = Math.floor(amount / 50);
    amount = amount % 50;

    var note20 = Math.floor(amount / 20);
    amount = amount % 20;

    var coin10 = Math.floor(amount / 10);
    amount = amount % 10;

    var coin5 = Math.floor(amount / 5);
    amount = amount % 5;

    var coin2 = Math.floor(amount / 2);
    amount = amount % 2;

    var coin1 = amount;

    document.getElementById("result").innerHTML =
    "1000 Baht : " + note1000 + "<br>" +
    "500 Baht : " + note500 + "<br>" +
    "100 Baht : " + note100 + "<br>" +
    "50 Baht : " + note50 + "<br>" +
    "20 Baht : " + note20 + "<br>" +
    "10 Baht : " + coin10 + "<br>" +
    "5 Baht : " + coin5 + "<br>" +
    "2 Baht : " + coin2 + "<br>" +
    "1 Baht : " + coin1;

}

</script>
<button onclick="window.location.href='index.html'">
    Back
</button>

</body>
</html>
