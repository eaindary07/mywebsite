<!DOCTYPE html>
<html>
<head>
    <title>Calculate Grade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Calculate Grade</h1>

    <label>Enter Score:</label>

    <input type="number" id="score" placeholder="Enter your score">

    <button onclick="calculateGrade()">Submit</button>

    <hr>

    <h2 id="answer">Your grade will appear here.</h2>

</div>

<script>

function calculateGrade(){

    var score = document.getElementById("score").value;

    if(score == "")
    {
        document.getElementById("answer").innerHTML =
        "Please enter a score.";
        return;
    }
    if(score < 0 || score > 100)
    {
        document.getElementById("answer").innerHTML =
        "Score must be between 0 and 100.";
         return;
    }

    if(score >= 85)
    {
        document.getElementById("answer").innerHTML =
        "You got an A!";
    }
    else if(score >= 75)
    {
        document.getElementById("answer").innerHTML =
        "You got a B!";
    }
    else if(score >= 65)
    {
        document.getElementById("answer").innerHTML =
        "You got a C!";
    }
    else if(score >= 45)
    {
        document.getElementById("answer").innerHTML =
        "You got a D!";
    }
    else if(score <= 45)
    {
        document.getElementById("answer").innerHTML =
        "You got an F!";
    }

}

</script>
<button onclick="window.location.href='index.html'">
    Back
</button>

</body>
</html>
